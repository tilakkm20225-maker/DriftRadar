services:
  - type: web
    name: driftradar
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: driftradar-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.8
databases:
  - name: driftradar-db
    plan: basic-256mb
